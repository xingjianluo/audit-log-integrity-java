audit.data-dir=${AUDIT_DATA_DIR:audit-data}
audit.mask-token=***REDACTED***
audit.sensitive-fields=password,idCard,phone,token
# 归档包：本环境标识与签名密钥（生产环境务必替换为强随机值）
audit.environment-id=${AUDIT_ENV_ID:local}
audit.archive-key=${AUDIT_ARCHIVE_KEY:}
# 信任的其他环境核验密钥，用于离线核验/导入外部归档包，例如：
# audit.trusted-archive-keys.envA=some-strong-key-of-envA
